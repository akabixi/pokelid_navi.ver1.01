<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- 検索エンジン向け基本タグ -->
  <title>ポケふたナビ | 全国ポケふたマップ＆ルート作成・アルバムアプリ</title>
  <meta name="description" content="全国500箇所以上の「ポケふた（ポケモンマンホール）」を網羅したマップアプリ。現在地や都道府県からの検索、訪問記録・My写真アルバム保存、Googleマップと連携した巡回ルート作成が可能です。">
  <meta name="keywords" content="ポケふた,ポケモンマンホール,マップ,ルート作成,ポケモン,ポケふたナビ,聖地巡礼">
  <meta name="google-site-verification" content="xvEs3zlDDPK7tVgnEXKixuYRCCNv1DrYrcPiphW0jd4" />
  
  <!-- SNSシェア用（OGPタグ） -->
  <meta property="og:title" content="ポケふたナビ | 全国のポケふた巡りをサポート">
  <meta property="og:description" content="全国のポケふたを効率よく巡ろう！訪問記録や写真アルバム、Googleマップ連携ルート作成機能を搭載。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://akabixi.github.io/pokelid_navi.ver1.01/">
  
  <!-- アイコン設定 -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  
  <!-- ライブラリ ＆ 外部CSSの読み込み -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <header>
    <h1>ポケふたナビ</h1>
    <div class="filter-group">
      <!-- ポケモン名リアルタイム検索欄 -->
      <input type="text" id="pokemonSearch" placeholder="🔍 ポケモン検索" oninput="renderMarkers(false)" style="padding: 6px 10px; border-radius: 6px; border: none; font-size: 13px; font-weight: bold; width: 120px; color: #1e3a8a;">

      <!-- 地方選択セレクト -->
      <select id="regionSelect" onchange="handleRegionChange(true)">
        <option value="all">全国</option>
        <option value="hokkaido">北海道</option>
        <option value="touhoku">東北</option>
        <option value="kanto">関東</option>
        <option value="chubu">中部</option>
        <option value="kansai">近畿</option>
        <option value="chugoku">中国</option>
        <option value="shikoku">四国</option>
        <option value="kyushu">九州・沖縄</option>
      </select>

      <!-- 都道府県マルチセレクトUI -->
      <div class="pref-dropdown">
        <button class="pref-dropdown-btn" onclick="togglePrefDropdown()">
          <span id="prefDropdownText">すべての県</span> ▼
        </button>
        <div id="prefDropdownContent" class="pref-dropdown-content">
          <div class="pref-actions">
            <button class="pref-action-btn" onclick="selectAllPrefs(true)">全選択</button>
            <button class="pref-action-btn" onclick="selectAllPrefs(false)">全解除</button>
          </div>
          <div id="prefCheckboxList"></div>
        </div>
      </div>
    </div>
  </header>

  <div id="map"></div>

  <!-- ミニウィンドウ（モーダル） -->
  <div id="photoModal" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modalTitle" class="spot-title">スポット名</div>
      <div id="modalPref" class="spot-pref">都道府県</div>

      <div class="photo-container">
        <div id="photoPlaceholder" class="photo-placeholder">📷 写真未登録<br>現地で撮った写真を残そう！</div>
        <img id="photoImg" class="photo-img" style="display: none;" alt="現地写真">
      </div>

      <label class="btn-photo-upload">
        📷 My写真を登録・変更
        <input type="file" accept="image/*" onchange="handlePhotoUpload(event)">
      </label>

      <a id="modalOfficialLink" href="#" target="_blank" rel="noopener noreferrer" class="btn-official">🔍 公式Webで絵柄を見る ↗</a>

      <div class="modal-btn-group">
        <button id="modalVisitBtn" class="btn-modal btn-visit" onclick="toggleVisitedCurrent()">未訪問</button>
        <button id="modalRouteBtn" class="btn-modal btn-add-route" onclick="addToRouteCurrent()">ルートに追加</button>
      </div>
    </div>
  </div>

  <div class="control-panel">
    <div class="panel-header">
      <span class="panel-title">巡回ルート</span>
      <div class="btn-backup-group">
        <button class="btn-backup" onclick="exportBackupData()">💾 保存</button>
        <label class="btn-restore">
          📂 復元
          <input type="file" accept=".json" onchange="importBackupData(event)" style="display:none;">
        </label>
        <button class="btn-clear" onclick="clearSelected()">クリア</button>
      </div>
    </div>

    <!-- ルート作成モード切り替えスイッチ -->
    <div class="route-mode-selector">
      <label>
        <input type="radio" name="routeMode" value="current" checked>
        🚗 現在地から出発
      </label>
      <label>
        <input type="radio" name="routeMode" value="spotsOnly">
        📍 ポケふた間のみ
      </label>
    </div>

    <div style="font-size: 11px; text-align: center; color: #6b7280; margin-top: 4px;">
      ご意見・不具合報告は <a href="https://x.com/akabixi" target="_blank" rel="noopener noreferrer" style="color: #2563eb; font-weight: bold; text-decoration: underline;">X (@akabixi)</a> まで
    </div>

    <div class="route-list-container">
      <ul id="routeList" class="route-list"></ul>
    </div>

    <div class="btn-group">
      <button id="navBtn" class="btn-main btn-primary" onclick="openGoogleMaps()" disabled>Googleマップでルートを開く</button>
    </div>
    
    <!-- Xでシェアするボタン -->
    <div style="margin-top: 8px;">
      <button id="shareBtn" class="btn-main" onclick="openShareModal()" style="background-color: #059669; color: white; width: 100%; font-weight: bold; padding: 10px; border-radius: 8px; border: none; cursor: pointer;">
        📸 今日の記録をXでシェア
      </button>
    </div>
  </div>

  <!-- SNSシェア用モーダル -->
  <div id="shareModal" class="share-modal-overlay">
    <div class="share-modal-content">
      <h3 style="margin-top:0; color:#1e3a8a;">📸 今日の訪問記録カード</h3>
      
      <!-- 一言メモ入力欄 -->
      <div style="margin: 8px 0; text-align: left;">
        <label style="font-size: 11px; font-weight: bold; color: #475569;">💬 カードに入れる一言メモ (任意):</label>
        <input type="text" id="shareMemoInput" placeholder="例：香川ヤドン巡り完了！" oninput="updateCardMemo()" style="width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 12px; margin-top: 2px; box-sizing: border-box;">
      </div>

      <!-- 生成される画像エリア -->
      <div id="shareCard">
        <div class="card-header">
          <div style="font-size: 16px;">ポケふたナビ 訪問記録</div>
          <div id="shareCardDate" style="font-size: 11px; opacity: 0.9; margin-top: 2px;"></div>
        </div>

        <div id="shareCardContent"></div>

        <!-- 一言メモのカード内表示エリア -->
        <div id="shareCardMemo" style="display:none; background:#f1f5f9; padding:8px; border-radius:6px; font-size:12px; color:#334155; margin-bottom:10px; font-style:italic; border-left:3px solid #059669;"></div>

        <div class="card-footer">
          <span id="shareCardCount">本日訪問: 0箇所</span>
          <span>akabixi.github.io/pokelid_navi.ver1.01/</span>
        </div>
      </div>

      <!-- プレビュー生成用エリア -->
      <div id="previewArea" style="display:none; margin-bottom:12px;">
        <p style="font-size: 12px; color: #059669; font-weight: bold;">👇 画像長押し（または右クリック）で保存してください！</p>
        <img id="generatedImg" style="width: 100%; border-radius: 8px; border: 1px solid #ccc;">
      </div>

      <div style="display: flex; gap: 8px; justify-content: center; margin-top: 12px;">
        <button onclick="generateCardImage()" style="background:#059669; color:white; border:none; padding:10px 14px; border-radius:6px; font-weight:bold; cursor:pointer;">① 画像を生成</button>
        <button onclick="postToX()" style="background:#000000; color:white; border:none; padding:10px 14px; border-radius:6px; font-weight:bold; cursor:pointer;">② Xでポスト</button>
        <button onclick="closeShareModal()" style="background:#94a3b8; color:white; border:none; padding:10px 10px; border-radius:6px; cursor:pointer;">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 外部JavaScriptの読み込み -->
  <script src="app.js"></script>
</body>
</html>
